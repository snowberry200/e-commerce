spring:
   datasource:
      url: jdbc:postgresql://localhost:5432/e-commerce
      username: fiifi
      password: postgres
   flyway:
      enabled: true
      baseline-on-migrate: true
      baseline-description: "init"
      baseline-version: 0
      
   jpa:
      hibernate:
         ddl-auto: none
         show-sql: true
logging:
   level:
      org:
         flywaydb: DEBUG
server:
   port: 8282

eureka:
   client:
      service-url:
         defaultZone: http://eureka-server:8761/eureka/
   instance:
      prefer-ip-address: true
      
