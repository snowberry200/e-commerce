spring:
  data:
    mongodb:
      host: localhost
      port: 8081
      database: customer_db
      # Remove username/password/authentication-database
      # unless your local Mongo actually has auth enabled

server:
  port: 8083

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true

logging:
  level:
    com.enkasa.customerservice: DEBUG
