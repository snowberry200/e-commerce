spring:
# data
  data:
    mongodb:
      host: mongodb-server
      port: 27017
      database: customer_db
      username: ${MONGO_USERNAME}
      password: ${MONGO_PASSWORD}
      authentication-database: admin
# service port
server:
  port: 8083
# eureka directory
eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true

logging:
  level:
    com.enkasa.customerservice: DEBUG
