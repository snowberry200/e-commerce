spring:
  application:
    name: customer-service
  data:
    mongodb:
      host: mongodb-server
      port: 27017
      database: customer_db
      username: ${MONGO_USERNAME}
      password: ${MONGO_PASSWORD}
      authentication-database: admin
  cloud:
    config:
      uri: http://localhost:8888
      enabled: true
      fail-fast: true
  config:
    import: configserver:http://localhost:8888 

server:
  port: 8083
